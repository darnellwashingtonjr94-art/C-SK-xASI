version: '3.8'

services:
  c-sk-xasi-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: c_sk_xasi_gateway
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - WORKERS=4
      - LOG_LEVEL=info
    volumes:
      - ./config:/app/config:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis-cache:
    image: redis:7-alpine
    container_name: c_sk_xasi_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
